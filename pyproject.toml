[build-system]
# Declared explicitly rather than relying on pip's legacy setuptools fallback: with no
# build-system table pip injects an unpinned setuptools environment, so a build is
# neither reproducible nor hermetic.
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "signeddata"
dynamic = ["version"]
# The description names the protocol and the documents, because that is the only text
# a person searching PyPI will read before deciding this is the library they need.
description = "Cryptographic Message Syntax: SignedData, EnvelopedData and AuthenticatedData, countersignatures, ESS attributes, signed properties and RFC 3161 timestamps"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Justin Capella" }]
keywords = ["cms", "pkcs7", "smime", "signed-data", "timestamp", "rfc5652", "rfc3161", "ess"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Networking",
  "Typing :: Typed",
]
# Empty unless a module cannot be honest without it. Every entry needs a sentence in
# README.md explaining why the zero-dependency rule was broken for it.
#
# asn1core is this workspace own ASN.1 codec: CMS is signed DER end to end, so the codec has to keep
# the bytes it parsed. It is not on an index yet, so it resolves from the sibling checkout, as pkix
# does. asn1crypto was declared here with no import and no justification, and is removed; nothing
# third-party is allowed. Signature arithmetic comes through sigwire[verify] (optional extra), path building from pkix.
dependencies = ["asn1core"]

[project.optional-dependencies]
# Signature checking (signeddata.verify) goes through sigwire.verify, a strict seam over the
# `cryptography` package, which the owner allows for primitives. Not on an index yet, so it
# resolves from the sibling checkout in tests (`pythonpath`); the base install needs neither.
verify = ["sigwire[verify]"]
# Certificate path validation for verify() is pkix's (RFC 5280 sec. 6). Like sigwire it is an
# unpublished sibling, imported lazily inside verify(), so the base install and cms.load need neither.
chain = ["pkix"]
dev = [
  "cryptography",
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "hypothesis",
  "ruff",
  "mypy",
  # tools/check_dist.py cannot assert a wheel contains what the docs promise without
  # first being able to build one, so the build dependency belongs in the dev group.
  "build",
]

[project.urls]
Homepage = "https://github.com/b1tninja/signeddata"
Repository = "https://github.com/b1tninja/signeddata"
Issues = "https://github.com/b1tninja/signeddata/issues"
Changelog = "https://github.com/b1tninja/signeddata/blob/main/CHANGELOG.md"

[project.scripts]
signeddata = "signeddata.cli:main"


[tool.hatch.version]
path = "signeddata/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["signeddata"]

[tool.hatch.build.targets.sdist]
include = ["/signeddata/", "/tests/", "/docs/", "/README.md", "/ROADMAP.md", "/CHANGELOG.md", "/LICENSE", "/NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "../asn1core" resolves the codec from the sibling checkout (see `dependencies`).
pythonpath = [".", "../asn1core", "../sigwire", "../pkix"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["signeddata"]

[tool.coverage.report]
# The shell floor, deliberately low and deliberately ratcheted: a stub only earns
# coverage for the line that raises. Raise this in the commit that implements a
# milestone, never in a commit that only adds tests, so the number keeps meaning
# "this behaviour is exercised" rather than "this file was imported".
fail_under = 77
show_missing = true
exclude_lines = [
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  "pragma: no cover",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "N", "UP", "SIM", "C4", "PT", "RUF", "S", "RET", "ARG"]
ignore = [
  "E501",  # line length is the formatter's job
]
# S101 is not ignored here: `python -O` strips an assert, so one in package code is a check that
# vanishes in exactly the build that ships without the test suite watching.

[tool.ruff.lint.per-file-ignores]
# S101 in tests is the policy, S311 is a seeded generator rather than a token, and a
# test double has to accept parameters it ignores, which ARG would otherwise flag.
"tests/*" = ["S101", "S106", "S311", "ARG001", "ARG002"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
mypy_path = "../asn1core:../sigwire:../pkix"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
